<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found (404)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 100px 20px; color: #333; background: #f8f9fa; }
        h1 { font-size: 3rem; color: #dc3545; margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #6c757d; margin-bottom: 30px; }
        .btn { background: #007bff; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>The link you followed might be broken, or the page has been moved.</p>
    <a href="/" class="btn">Back to Home</a>
</body>
</html>
